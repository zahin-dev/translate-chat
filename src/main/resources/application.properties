spring.application.name=talklear
server.address=${CHAT_BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://127.0.0.1:55432/translate_chat}
spring.datasource.username=${CHAT_DB_USER:chat}
spring.datasource.password=${CHAT_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.sql.init.mode=always
spring.jackson.serialization.write-dates-as-timestamps=false
spring.web.resources.cache.period=0
server.tomcat.max-http-form-post-size=16KB
server.tomcat.max-swallow-size=16KB
server.max-http-request-header-size=8KB
