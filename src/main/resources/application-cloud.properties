# Explicit CHAT_DB_* settings take priority; Vercel's Neon integration supplies PG*.
# Empty defaults never fall back to this PC's database. TLS verifies the server using the JVM trust store.
server.address=0.0.0.0
spring.datasource.url=${CHAT_DB_URL:jdbc:postgresql://${PGHOST:}/${PGDATABASE:}?sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory}
spring.datasource.username=${CHAT_DB_USER:${PGUSER:}}
spring.datasource.password=${CHAT_DB_PASSWORD:${PGPASSWORD:}}
chat.public-origin=${CHAT_PUBLIC_ORIGIN}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
