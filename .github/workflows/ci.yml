name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: chat
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: translate_chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chat -d translate_chat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CHAT_DB_USER: chat
      CHAT_DB_PASSWORD: ci-test-only
      CHAT_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/translate_chat_test
      CHAT_DOCKER_DB_PASSWORD: ci-container-test-only
      CHAT_SMOKE_RECREATE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Message and translation logic
        run: node --test tests/translator.test.mjs tests/message-feed.test.mjs
      - name: Frontend syntax
        run: |
          for file in src/main/resources/static/*.js; do node --check "$file"; done
      - name: HTTP, database and origin checks
        run: mvn -B verify
      - name: Cloud image
        run: docker build -f Dockerfile.vercel -t translate-chat:local .
      - name: Docker conversation and persistence
        run: |
          docker compose up -d --no-build
          node --test tests/docker-smoke.test.mjs
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - name: Stop project containers
        if: always()
        run: docker compose down
