name: translate-chat-local

services:
  app:
    image: translate-chat:local
    build:
      context: .
      dockerfile: Dockerfile.vercel
    ports:
      - "127.0.0.1:${CHAT_DOCKER_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: cloud
      PORT: "8080"
      CHAT_DB_URL: jdbc:postgresql://db:5432/translate_chat
      CHAT_DB_USER: chat
      CHAT_DB_PASSWORD: ${CHAT_DOCKER_DB_PASSWORD:?Run Start-Docker.ps1 first}
      CHAT_PUBLIC_ORIGIN: http://localhost:${CHAT_DOCKER_PORT:-8080}
    depends_on:
      db:
        condition: service_healthy
    init: true
    stop_grace_period: 30s

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: translate_chat
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: ${CHAT_DOCKER_DB_PASSWORD:?Run Start-Docker.ps1 first}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat -d translate_chat"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    stop_grace_period: 30s

volumes:
  postgres-data:
