# Explicit cloud configuration: no fallback to this PC's database or public URL.
server.address=0.0.0.0
spring.datasource.url=${CHAT_DB_URL}
spring.datasource.username=${CHAT_DB_USER}
spring.datasource.password=${CHAT_DB_PASSWORD}
chat.public-origin=${CHAT_PUBLIC_ORIGIN}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
